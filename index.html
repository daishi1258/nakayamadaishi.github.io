<!-- ① HTML5の標準規格で書くという宣言 -->
<!DOCTYPE html>

<!-- ② ここからHTMLコード開始（言語は日本語に設定） -->
<html lang="ja">

<!-- ==========================================
  【headタグ】ブラウザへの「設定・指示」を入れる場所
=========================================== -->
<head>
  <!-- 文字化けを防ぐための設定（UTF-8という文字コードを指定） -->
  <meta charset="UTF-8" />

  <!-- スマホやPCなど、画面サイズに合わせて綺麗に表示（レスポンシブ対応）させる設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ブラウザのタブや検索結果に表示されるサイトのタイトル -->
  <title>NakayamaDaishi | Official Site</title>

  <!-- 外見（デザイン・レイアウト）を整えるCSSファイルを読み込む -->
  <link rel="stylesheet" href="style.css" />

  <!-- Google Fonts（おしゃれなフォント）をネットから読み込む -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

</head>

<!-- ==========================================
  【bodyタグ】実際にブラウザの「画面上に表示される内容」を入れる場所
=========================================== -->
<body>

  <!-- ナビゲーションバー（画面上部のメニューリンク） -->
  <header class="navbar">
    <!-- 左上の名前ロゴ（クリックでトップページへ戻る） -->
    <a href="index.html" class="nav-logo" aria-label="トップページへ戻る">
      <img src="images/logo-nav.png" alt="Nakayama Daishi" />
    </a>
    <nav>
      <a href="live.html">LIVE</a>
      <a href="#movie">MOVIE</a>
      <a href="profile.html">PROFILE</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>


  <!-- ファーストビュー（サイトを開いた時に最初に見えるメイン画像領域） -->
  <section class="hero">
    <img src="images/moji.png" alt="NakayamaDaishi" class="hero-logo" />
  </section>


  <!-- 【LIVEセクション】ライブ日程のリストコーナー（洗練ダークカードデザイン） -->
  <section id="live" class="section">
    <!-- スクロールで現れる動き。要素ごとに動きを変える（reveal-track：文字間が縮む／reveal-up：下から浮かぶ／reveal-zoom：弾んで現れる）。
         transition-delay で、見出し→カード→ボタンの順に、少しずつ遅らせる -->
    <h2 class="reveal-track">LIVE</h2>

    <!-- NEXT LIVE カード。中身は、下の JavaScript が microCMS から読み込んで、
         今日以降でいちばん近いライブを自動で入れる（ライブの日の23:59を過ぎたら、次のライブに切り替わる） -->
    <div id="next-live-card" class="next-live-card reveal-up" style="transition-delay: 0.25s;">
      <div class="next-live-tag">NEXT LIVE</div>
      <div class="live-date"></div>
      <div class="live-status"></div>
      <div class="live-venue"></div>
      <div class="live-details"><p>ライブ情報を読み込み中...</p></div>
    </div>

    <!-- 過去や今後の全ライブ情報ページ（live.html）へ移動するボタン -->
    <div class="reveal-zoom" style="margin-top: 2.5rem; transition-delay: 0.5s;">
      <a href="live.html" class="btn view-all">View All</a>
    </div>
  </section>


  <!-- 【動画セクション】音なし自動再生・ループ（YouTube「Squall」MV）
       動画を変えるときは、下の iframe の src にある動画ID（ZP_Ghxy0H34 が2か所）を書き換える -->
  <style>
    .short-section {
      padding: 4rem 1rem;
      text-align: center;
    }
    .short-frame {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
    }
    .short-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    /* スマホ：画面の端まで広げ、正方形の枠に動画を拡大して表示（左右は少し切れる） */
    @media (max-width: 768px) {
      .short-section {
        padding: 2rem 0;
      }
      .short-frame {
        max-width: none;
        aspect-ratio: 1 / 1;
        position: relative;
        overflow: hidden;
      }
      .short-frame iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 177.78%;
        height: 100%;
        transform: translate(-50%, -50%);
      }
    }
  </style>
  <section id="short" class="section short-section">
    <div class="short-frame">
      <iframe
        src="https://www.youtube.com/embed/ZP_Ghxy0H34?autoplay=1&mute=1&loop=1&playlist=ZP_Ghxy0H34&controls=0&playsinline=1&rel=0&cc_load_policy=0&iv_load_policy=3&disablekb=1&modestbranding=1"
        title="Squall music video"
        allow="autoplay; encrypted-media"
        allowfullscreen></iframe>
    </div>
  </section>


  <!-- 【MOVIEセクション】動画一覧のコーナー -->
  <section id="movie" class="section movie-section">
    <h2>MOVIE</h2>

    <div class="movie-grid">
      <!-- 1つ目の動画枠 -->
      <div class="movie-box fade-in-left">
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/FY0knjHxqX8" title="YouTube video 1" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>

      <!-- 2つ目の動画枠 -->
      <div class="movie-box fade-in-left">
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/CY9EIVo3M5g" title="YouTube video 2" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>

      <!-- 3つ目の動画枠 -->
      <div class="movie-box fade-in-left">
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/fuOGROAnBGg" title="YouTube video 3" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>
    </div>

    <!-- YouTubeチャンネルへのリンクボタン -->
    <div class="more-button">
      <a href="https://www.youtube.com/@daishinakayama1220" class="btn" target="_blank" rel="noopener noreferrer">MORE VIDEOS</a>
    </div>
  </section>


  <!-- 【PROFILEセクション】プロフィール概要コーナー -->
  <section id="profile" class="profile-section fade-in-left">
    <!-- 背景動画（音なし・自動再生・ループ）。読み込み前や再生できない環境では、写真が表示される -->
    <video class="profile-bg-video" autoplay muted loop playsinline preload="auto" poster="images/profile.jpg" aria-hidden="true">
      <source src="videos/profile-bg.mp4" type="video/mp4">
    </video>

    <div class="profile-overlay">
      <h2 class="profile-heading">
        <span class="label">ABOUT</span><br />
        <span class="name">Nakayama Daishi</span>
      </h2>
      <!-- 詳細プロフィールページ（profile.html）へ移動するボタン -->
      <a href="profile.html" class="btn">MORE INFORMATION</a>
    </div>
  </section>


  <!-- 【CONTACTセクション】各SNSやまとめリンク（Linktree）への案内 -->
  <section id="contact" class="contact-section">
    <div class="links-inner reveal-up">
      <!-- リンク集のイメージ画像（クリックで Linktree へ）。画像の中身は、Linktree の内容を元にした静止画なので、
           リンクの名前などを変えたときは、画像も作り直す。読み上げソフトには、下の ALL LINKS ボタンだけを伝える -->
      <a href="https://linktr.ee/Daishi_1258" class="links-card" target="_blank" rel="noopener noreferrer" aria-hidden="true" tabindex="-1">
        <img src="images/links-card.png" alt="" width="400" height="590" />
      </a>

      <a href="https://linktr.ee/Daishi_1258" class="linktree-highlight" target="_blank" rel="noopener noreferrer">
        🔗 ALL LINKS
      </a>
    </div>
  </section>


  <!-- 【お問い合わせフォーム】メッセージ送信エリア -->
  <section id="contact-form" class="section contact-form-section fade-in-left">
    <h2>CONTACT</h2>
    <p class="form-lead">お問い合わせ</p>

    <form action="https://formspree.io/f/mjkrorgr" method="POST" class="contact-form">
      <label for="name">NAME<small>お名前</small></label>
      <input type="text" id="name" name="name" required>

      <label for="email">EMAIL<small>メールアドレス</small></label>
      <input type="email" id="email" name="email" required>

      <label for="message">MESSAGE<small>メッセージ</small></label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">SEND</button>
    </form>
  </section>


  <!-- ==========================================
    【JavaScript】動きやアニメーションをつけるプログラム
  =========================================== -->
  <script>
    const targets = document.querySelectorAll('.fade-in-left, .reveal-track, .reveal-up, .reveal-zoom');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
        }
      });
    }, {
      threshold: 0.1
    });

    targets.forEach(target => observer.observe(target));
  </script>

  <!-- NEXT LIVE：microCMS のライブ一覧から、今日以降でいちばん近い日程を1件選んで、カードに入れる
       （日付の読み取り方と「前売り予約受付中」などの表示は、live.html と同じ決まり） -->
  <script>
    const SERVICE_DOMAIN = "junkie2631150";
    const API_KEY = "Yzz4uqi9JCUN0riBvtYRwVBuUMJ6q22Pvwce";

    // 全角の数字・記号を半角にそろえる
    function toHalfWidth(str) {
      if (!str) return '';
      return str
        .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0))
        .replace(/[Ａ-Ｚａ-ｚ]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0))
        .replace(/：/g, ':')
        .replace(/／/g, '/')
        .replace(/￥/g, '¥');
    }

    // 「2026年10月8日」「2026.9/25」など、いろいろな書き方の日付を読み取る
    function parseLiveDate(rawDateStr) {
      const normalized = toHalfWidth(rawDateStr || '')
        .replace(/[年月日\/\-]/g, '.')
        .replace(/\.+/g, '.');
      const match = normalized.match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
      if (!match) return null;

      const year = parseInt(match[1]);
      const month = parseInt(match[2]);
      const day = parseInt(match[3]);
      const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][new Date(year, month - 1, day).getDay()];
      return {
        year, month, day,
        formatted: `${year}.${String(month).padStart(2, '0')}.${String(day).padStart(2, '0')} (${dayOfWeek})`,
        end: new Date(year, month - 1, day, 23, 59, 59)
      };
    }

    function getStatusMessage(d) {
      const now = new Date();
      const liveDayStart = new Date(d.year, d.month - 1, d.day, 0, 0, 0);
      const liveDayCutoff = new Date(d.year, d.month - 1, d.day, 15, 0, 0);

      if (now < liveDayStart) return '前売り予約受付中';
      if (now < liveDayCutoff) return '当日15時までなら前売り予約受付中';
      if (now <= d.end) return '飛び込みOK';
      return '';
    }

    function formatDetail(rawDetailStr) {
      return toHalfWidth(rawDetailStr || '')
        .replace(/(開場|OPEN|Open)/g, 'open')
        .replace(/(開演|START|Start)/g, 'start');
    }

    async function showNextLive() {
      const card = document.getElementById('next-live-card');
      const details = card.querySelector('.live-details');

      try {
        const response = await fetch(`https://${SERVICE_DOMAIN}.microcms.io/api/v1/live?limit=100`, {
          headers: { "X-MICROCMS-API-KEY": API_KEY }
        });
        if (!response.ok) throw new Error('データ取得失敗');
        const data = await response.json();

        // 当日のライブは、その日の23:59:59まで「次のライブ」として残す
        const now = new Date();
        const next = data.contents
          .map(item => ({ ...item, dateInfo: parseLiveDate(item.date) }))
          .filter(item => item.dateInfo && item.dateInfo.end >= now)
          .sort((a, b) => a.dateInfo.end - b.dateInfo.end)[0];

        if (!next) {
          details.innerHTML = '<p>現在予定されているライブはありません。</p>';
          return;
        }

        card.querySelector('.live-date').textContent = next.dateInfo.formatted;
        card.querySelector('.live-status').textContent = getStatusMessage(next.dateInfo);
        card.querySelector('.live-venue').textContent = next.place || '';
        details.innerHTML = formatDetail(next.detail);
      } catch (error) {
        console.error('エラー:', error);
        details.innerHTML = '<p>ライブ情報は「View All」からご覧ください。</p>';
      }
    }

    showNextLive();
  </script>

</body>
</html>
