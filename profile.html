<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | Nakayama Daishi</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      line-height: 1.8;
      color: #111;
      background-color: #fff;
    }

    .profile-image-section {
      overflow: hidden;
    }

    .profile-image-section img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      object-position: center 38%; /* 縦長の写真を横長に切り取るとき、顔が中心に来る位置 */
      display: block;
      animation: photoIn 2.2s ease-out forwards;
    }

    /* 写真：ふわっと表示しながら、ゆっくり縮む（ズームアウト） */
    @keyframes photoIn {
      from { opacity: 0; transform: scale(1.12); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* 文字：スクロールで画面に入ると、下からふわっと表示 */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .reveal.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 動きを減らす設定のOSでは、アニメーションなしで表示 */
    @media (prefers-reduced-motion: reduce) {
      .profile-image-section img { animation: none; }
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    .profile-text-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
      background-color: #fff;
    }

    .profile-text-section h1,
    .profile-text-section h2 {
      font-size: 2rem;
      margin-bottom: 2rem;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
    }

    .profile-text-section p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      text-align: justify;
    }

    /* 紹介文と、2021年からの経歴を区切る（区切り線＋HISTORY見出し） */
    .profile-text-section ul {
      list-style: none;
      margin-top: 4rem;
      padding: 3rem 0 0;
      border-top: 1px solid #ccc;
      font-size: 1rem;
    }

    .profile-text-section ul::before {
      content: "HISTORY";
      display: block;
      margin-bottom: 2.5rem;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      letter-spacing: 0.3em;
    }

    /* 経歴：左に縦線、日付を太字で上に、内容をその下に */
    .profile-text-section ul li {
      margin-bottom: 1.8rem;
      padding-left: 1.2rem;
      border-left: 2px solid #ccc;
      text-align: left;
    }

    .profile-text-section .history-date {
      display: block;
      margin-bottom: 0.2rem;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    /* microCMS の入力で生まれる空の段落は非表示にする */
    .profile-text-section p:empty {
      display: none;
    }

    .profile-text-section .loading {
      text-align: center;
      color: #888;
      font-style: italic;
    }

    @media (max-width: 768px) {
      .profile-image-section img {
        height: auto;
      }

      .profile-text-section {
        padding: 3rem 1rem;
      }

      .profile-text-section h1,
      .profile-text-section h2 {
        font-size: 1.5rem;
      }

      .profile-text-section p,
      .profile-text-section ul li {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- ナビゲーションバー（画面上部のメニューリンク） -->
  <header class="navbar">
    <!-- 左上の名前ロゴ（クリックでトップページへ戻る） -->
    <a href="index.html" class="nav-logo" aria-label="トップページへ戻る">
      <img src="images/logo-nav.png" alt="Nakayama Daishi" />
    </a>
    <nav>
      <a href="live.html">LIVE</a>
      <a href="index.html#movie">MOVIE</a>
      <a href="profile.html">PROFILE</a>
      <a href="index.html#contact">CONTACT</a>
    </nav>
  </header>

  <section class="profile-image-section">
    <img src="images/profile.jpg" alt="Nakayama Daishi" />
  </section>

  <section class="profile-text-section">
    <!-- microCMS の「profile」APIから取得した内容がここに入ります -->
    <div id="profile-content" class="loading">プロフィールを読み込み中...</div>
  </section>
<div class="back-to-top">
  <a href="index.html" class="btn-back">← トップページに戻る</a>
</div>

  <script>
    const SERVICE_DOMAIN = "junkie2631150";
    const API_KEY = "Yzz4uqi9JCUN0riBvtYRwVBuUMJ6q22Pvwce";

    // .reveal の要素が画面に入ったら .show を付けて表示する
    const revealObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    async function loadProfile() {
      const container = document.getElementById('profile-content');

      try {
        const response = await fetch(`https://${SERVICE_DOMAIN}.microcms.io/api/v1/profile`, {
          headers: { "X-MICROCMS-API-KEY": API_KEY }
        });

        if (!response.ok) throw new Error('データ取得失敗');

        const data = await response.json();
        container.classList.remove('loading');
        container.innerHTML = data.profile || '';

        // 経歴の先頭にある「2021年10月」「2023年10月～2024年11月」を日付として取り出す
        container.querySelectorAll('li').forEach(li => {
          const first = li.firstChild;
          if (!first || first.nodeType !== Node.TEXT_NODE) return;

          const match = first.nodeValue.match(/^\s*(\d{4}年\d{1,2}月(?:\s*[～〜~\-]\s*\d{4}年\d{1,2}月)?)\s*([\s\S]*)$/);
          if (!match) return;

          const date = document.createElement('span');
          date.className = 'history-date';
          date.textContent = match[1];
          first.nodeValue = match[2];
          li.insertBefore(date, first);
        });

        // 見出し・段落・リストの各項目に、スクロールで浮かび上がる動きをつける
        container.querySelectorAll('h1, h2, h3, p, li').forEach(el => {
          el.classList.add('reveal');
          revealObserver.observe(el);
        });

      } catch (error) {
        console.error('エラー:', error);
        container.innerHTML = '<p style="text-align:center;">プロフィールの読み込みに失敗しました。</p>';
      }
    }

    loadProfile();
  </script>

</body>
</html>
